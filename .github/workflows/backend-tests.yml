name: Backend Tests
# `tests/**` IS IN THESE FILTERS AND WAS NOT (D-089). `pytest.ini`'s testpaths
# have listed `tests` since 2026-09-03, so this workflow RUNS that suite — but
# nothing here fired when it changed. A suite you can edit without triggering
# the job that runs it is a suite whose breakage surfaces on someone else's
# unrelated PR, which is how its 40 failures became "the known-red baseline"
# instead of a thing anybody owned.
#
# `db/**` for the same reason, one step further out: a migration changes the
# schema these suites assert against and did not trigger them either.
on:
  push:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "tests/**"
      - "db/**"
      - "pytest.ini"
      - "scripts/**"
      # apps/web is a frontend project, but its seven trendy-*.html templates
      # are a live render path (apps/web/lib/templates.ts's header explains how)
      # and the colour lint below is the only thing checking them. Without this
      # line a web template could gain a brand literal and the ratchet would not
      # fire until something else touched the backend — the same "edit a file
      # without triggering the job that checks it" gap D-089 was.
      - "apps/web/templates/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "tests/**"
      - "db/**"
      - "pytest.ini"
      - "scripts/**"
      # apps/web is a frontend project, but its seven trendy-*.html templates
      # are a live render path (apps/web/lib/templates.ts's header explains how)
      # and the colour lint below is the only thing checking them. Without this
      # line a web template could gain a brand literal and the ratchet would not
      # fire until something else touched the backend — the same "edit a file
      # without triggering the job that checks it" gap D-089 was.
      - "apps/web/templates/**"
      - ".github/workflows/backend-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12, because that is what production runs. It used to be 3.12 for a
      # second, sharper reason as well, and that reason is now gone:
      # services/email.py interpolated strings containing \u escapes inside
      # f-string expression parts, which PEP 701 only permits from 3.12
      # ("SyntaxError: f-string expression part cannot include a backslash",
      # services/email.py:729), so the API suite could not be COLLECTED on
      # 3.11 at all. D-147 fixed the source rather than continuing to pin
      # around it, and tests/../test_sources_parse.py compiles every file on
      # whichever interpreter is running so it cannot come back unnoticed.
      #
      # The pin stays at 3.12 anyway: CI should run what the deployed runtime
      # runs, not the oldest version the code happens to tolerate.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      # There is no requirements.txt in this repository and there never has
      # been; this workflow used to fail at `pip install -r requirements.txt`
      # before running a single test. apps/api and apps/worker are Poetry
      # projects with lock files, which is also how the Render services build
      # (`pip install poetry && poetry install --no-root`), so Poetry is the
      # honest source of truth.
      #
      # Both projects install into ONE shared virtualenv. pytest.ini declares a
      # single session spanning both packages (testpaths + pythonpath), and
      # apps/worker/tests/test_unsubscribe_token_roundtrip.py imports from both
      # on purpose — the worker signs the unsubscribe token and the API
      # verifies it, so testing that contract needs both dependency sets
      # present at once. An explicit venv is used rather than
      # virtualenvs.create=false, which installs into the system interpreter and
      # collides with OS-managed packages.
      - name: Create shared virtualenv
        run: python -m venv .venv

      - name: Install API dependencies
        working-directory: apps/api
        run: poetry install --no-root
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
          POETRY_VIRTUALENVS_CREATE: "false"

      - name: Install Worker dependencies
        working-directory: apps/worker
        run: poetry install --no-root
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
          POETRY_VIRTUALENVS_CREATE: "false"

      # CHROMIUM, BECAUSE ONE TEST MEASURES WHAT A BROWSER PAINTS.
      # test_pdf_contrast.py walks every market and property render for
      # unreadable text. PDFShift produces these PDFs with Chromium, so
      # getComputedStyle is the ground truth; a CSS cascade written in Python
      # would be a model of it that can disagree in silence, which is the
      # failure that test exists to catch (docs/TEST_DURABILITY.md).
      #
      # ~90 documents in 38 seconds locally. The install is the slow part, not
      # the measurement.
      # 20.x, because that is what package.json's `engines` declares. 22 works
      # and warns EBADENGINE on every install; CI should run the version the
      # repository says it supports.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # `npm ci`, not `npm install`: it fails on a lock file that disagrees
      # with package.json instead of silently rewriting it. The first run of
      # this step did exactly that — ts-node was in package.json and eleven of
      # its transitive dependencies were missing from package-lock.json, so
      # `npm ci` had been broken here for anyone who tried it. Fixed in this
      # PR with `npm install --package-lock-only` (additions only, no version
      # changes), because working around it with `npm install` would have left
      # the same trap for the next person.
      - name: Install node dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # One invocation from the repo root. pytest.ini's testpaths already covers
      # apps/api/tests and apps/worker/tests; running them as separate steps
      # would put the cross-package test in an environment missing half of what
      # it imports.
      #
      # PDF_CONTRAST_REQUIRE_BROWSER=1 turns "no browser" into a FAILURE rather
      # than a skip. Locally the contrast gate skips when Chromium is absent;
      # in CI a skip would mean the suite reports green on documents nothing
      # looked at, which is precisely the state this gate was added to end.
      - name: Run tests
        run: .venv/bin/pytest
        env:
          PDF_CONTRAST_REQUIRE_BROWSER: "1"

      # Workstream A's acceptance criterion: no brand hex literal in a template.
      # A ratchet, not a gate — there are 111 today and removing them changes
      # what ships, so they are baselined in scripts/template_color_baseline.txt
      # and only a NEW one fails the build.
      #
      # This runs on the standard library alone and does not need the venv. It
      # is a separate step from pytest so the failure says which thing broke;
      # tests/test_template_color_lint.py covers the rule's own behaviour,
      # including the positive control that proves it still matches anything.
      - name: Lint template colours
        run: python3 scripts/lint_template_colors.py --check-baseline
