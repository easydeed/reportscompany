<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:816px;height:1056px;overflow:hidden">
  <dc-import name="Property Report" theme="{{ theme }}" brand="{{ brand }}" street="{{ street }}" city="{{ city }}" zip="{{ zip }}" brand-name="{{ brandName }}" agent-name="{{ agentName }}" agent-phone="{{ agentPhone }}" agent-email="{{ agentEmail }}" path="{{ path }}" requester-name="{{ requesterName }}" beds="{{ beds }}" baths="{{ baths }}" baths-known="{{ bathsKnown }}" sqft="{{ sqft }}" year-built="{{ yearBuilt }}" hint-size="816px,1056px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:816,&quot;height&quot;:1056},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;elegant&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;elegant&quot;,&quot;bold&quot;,&quot;modern&quot;]},&quot;brand&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;teal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;red&quot;,&quot;teal&quot;,&quot;cyan&quot;,&quot;amber&quot;,&quot;lime&quot;,&quot;violet&quot;]}}">
class Component extends DCLogic {
  renderVals() { const P = this.props; return { theme: P.theme || "elegant", brand: P.brand || "teal", street: P.street, city: P.city, zip: P.zip, brandName: P.brandName, agentName: P.agentName, agentPhone: P.agentPhone, agentEmail: P.agentEmail, path: P.path, requesterName: P.requesterName, beds: P.beds, baths: P.baths, bathsKnown: P.bathsKnown, sqft: P.sqft, yearBuilt: P.yearBuilt }; }
}
</script>
</body>
</html>
