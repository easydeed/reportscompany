[pytest]
asyncio_mode = auto
python_files = test_*.py
# NOTE: `tests/` is listed as a single FILE, not the directory. The directory
# also holds test_market_templates.py, test_property_templates.py,
# test_new_metrics.py and test_simplyrets_query_builder.py — four suites that
# docs/architecture/modules/test-suite.md documents as the project's test suite
# and that testpaths has never collected (D-053). Collecting the directory adds
# 226 tests of which 40 currently fail; that is a CI-scope decision, not a
# side effect of adding a guard test. Widen this to `tests` when that decision
# is made.
testpaths = apps/api/tests apps/worker/tests tests/test_migration_bootstrap_guard.py
pythonpath = apps/api/src apps/worker/src

