[pytest]
asyncio_mode = auto
python_files = test_*.py
# `tests/` is collected as a DIRECTORY (D-054). It holds four suites that
# docs/architecture/modules/test-suite.md and
# .cursor/rules/market-report-templates-skill.md document as the project's test
# suite, and that testpaths did not list — so nothing ever ran them, in CI or
# locally from the repo root. They are not scratch files: the skill doc's
# "Template test suite (57 tests)" describes test_market_templates.py, which
# has exactly 57.
#
# Collecting them turns the backend pipeline red: 40 of the 207 fail. Those
# failures are PRE-EXISTING and were previously invisible, not new breakage —
# the same trade already made for D-038 (backend CI) and D-041 (frontend CI).
# A pipeline that reports real failures beats one that reports nothing.
# Do not narrow this back to silence them; fix them or record why not.
testpaths = apps/api/tests apps/worker/tests tests
pythonpath = apps/api/src apps/worker/src

