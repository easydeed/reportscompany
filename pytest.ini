[pytest]
asyncio_mode = auto
python_files = test_*.py
# `tests/` is collected as a DIRECTORY (D-054). It holds four suites that
# docs/architecture/modules/test-suite.md and
# .cursor/rules/market-report-templates-skill.md document as the project's test
# suite, and that testpaths did not list — so nothing ever ran them, in CI or
# locally from the repo root. They are not scratch files: the skill doc's
# "Template test suite (57 tests)" describes test_market_templates.py, which
# has exactly 57.
#
# Collecting them turned the backend pipeline red: 40 of the 207 failed. Those
# failures were PRE-EXISTING and previously invisible, not new breakage — the
# same trade already made for D-038 (backend CI) and D-041 (frontend CI).
# A pipeline that reports real failures beats one that reports nothing.
# Do not narrow this back to silence them; fix them or record why not.
#
# RESOLVED 2026-09-22 (D-089). All 40 were triaged and none was a product
# defect that this suite had caught; every one was the suite describing a
# system that had moved. 27 were the tests' own fault (hand-built fixtures the
# builders cannot produce, a copied filter that drifted, a page-counting
# heuristic that undercounted, an assertion pointed at a footer that moved into
# PDFShift's `footer` param) and are fixed. 13 are RIGHT about a product change
# that is deliberately gated — `cities` on the production probe (D-087), the
# `type` vocabulary on its own diff (D-088) — and carry `xfail(strict=True)`
# naming the defect. Strict, so the day either lands the unexpected pass fails
# the build and the marker comes off.
#
# Triaging them also turned up a real defect the suite had NOT been catching:
# a NULL column rendering as the word "None" in customer PDFs (D-090).
#
# `apps/api/tests` is still red — 34 failures and 5 errors, pre-existing,
# never part of the 40, and the same drift one directory over (D-091).
testpaths = apps/api/tests apps/worker/tests tests
pythonpath = apps/api/src apps/worker/src

